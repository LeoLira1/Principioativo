name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Assinatura de release opcional: se os secrets existirem, o APK sai
      # assinado com a chave própria (atualizações instalam por cima).
      - name: Preparar keystore (opcional)
        env:
          PA_KEYSTORE_BASE64: ${{ secrets.PA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PA_KEYSTORE_BASE64" ]; then
            echo "$PA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pa.jks"
            echo "PA_KEYSTORE_FILE=$RUNNER_TEMP/pa.jks" >> "$GITHUB_ENV"
          fi

      # Tag do Release: a própria tag v* ou, em push na main / execução
      # manual, v1.0.<número da execução> criada pelo workflow.
      - name: Definir versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PA_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PA_TAG=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Testes
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar APK
        env:
          PA_KEYSTORE_PASSWORD: ${{ secrets.PA_KEYSTORE_PASSWORD }}
          PA_KEY_ALIAS: ${{ secrets.PA_KEY_ALIAS }}
          PA_KEY_PASSWORD: ${{ secrets.PA_KEY_PASSWORD }}
          PA_VERSION_CODE: ${{ github.run_number }}
          PA_VERSION_NAME: ${{ env.PA_TAG }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk principio-ativo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: principio-ativo-apk
          path: principio-ativo.apk

      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PA_TAG }}
          target_commitish: ${{ github.sha }}
          name: Princípio Ativo v${{ env.PA_TAG }}
          files: principio-ativo.apk
          make_latest: true
          generate_release_notes: true
